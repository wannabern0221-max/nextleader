<main>
  <section class="page-hero"><div class="container"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>비밀번호 재설정</h1><p>메일로 받은 재설정 링크를 통해 새 비밀번호를 등록합니다.</p></div></section>
  <section class="page-content"><div class="container"><div class="auth-shell single-auth-shell"><section class="auth-panel">
    <form id="newPasswordForm" data-auth-form>
      <div class="form-grid">
        <div class="field full"><label for="newPassword">새 비밀번호</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상"></div>
        <div class="field full"><label for="newPasswordConfirm">새 비밀번호 확인</label><input id="newPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required placeholder="한 번 더 입력"></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">비밀번호 변경</button><a class="btn btn-outline" href="login.html">로그인으로 돌아가기</a></div>
    </form>
    <div id="recoveryMessage" class="auth-message show info" aria-live="polite">재설정 링크를 확인하고 있습니다.</div>
  </section></div></div></section>
</main>
