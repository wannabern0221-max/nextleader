name: Update nursing policy news

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nursing-policy-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest news
        run: python scripts/fetch_news.py
      - name: Commit updated news
        run: |
          git config user.name "Policy News Updater"
          git config user.email "actions@users.noreply.github.com"
          git add data/external-news.json
          git diff --cached --quiet || git commit -m "간호·정책 뉴스 자동 갱신"
          git push
