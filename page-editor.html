<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="대한간호학생회 부산 정책국 페이지 편집기">
  <title>페이지 편집기 | 대한간호학생회 부산 정책국</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/page-builder.css?v=20260802-ui">
  <link rel="stylesheet" href="assets/page-editor.css?v=20260802-ui"><link rel="stylesheet" href="assets/file-upload.css?v=20260802-files">
</head>
<body data-page="page-editor">
<div class="utility"><div class="container"><span>대한간호학생회 부산 · 정책국</span><div class="utility-actions"><a href="dashboard.html">리더 홈</a><a href="site-manager.html">홈페이지 관리</a></div></div></div>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><img src="assets/emblem.png" alt="대한간호학생회 부산 로고"><span><strong>대한간호학생회 부산</strong><span>페이지 운영 편집기</span></span></a></div></header>
<main class="editor-main">
  <section class="editor-topbar">
    <div class="container editor-topbar-inner">
      <div><span class="eyebrow">PAGE BUILDER</span><h1 id="editorPageTitle">페이지 편집기</h1><p>보안 코드에는 손대지 않고 문구·디자인·블록·이미지·팝업을 관리합니다.</p></div>
      <div class="editor-top-actions">
        <select id="pageSelect" aria-label="편집할 페이지"></select>
        <a class="btn btn-outline" id="openTargetPage" href="index.html" target="_blank" rel="noopener">현재 페이지 열기</a>
        <button class="btn btn-outline" id="saveLocalDraft" type="button">임시저장</button>
        <button class="btn btn-outline" id="openFullPreview" type="button">전체 미리보기</button>
        <button class="btn btn-primary" id="publishPage" type="button">게시</button>
      </div>
    </div>
  </section>
  <section class="editor-workspace container" id="editorRoot">
    <div class="editor-loading">정책국장 권한과 페이지 설정을 확인하고 있습니다.</div>
  </section>
</main>
<div class="editor-full-preview" id="fullPreviewModal" hidden>
  <div class="editor-full-preview-backdrop" data-close-full-preview></div>
  <section class="editor-full-preview-panel" role="dialog" aria-modal="true" aria-labelledby="fullPreviewTitle">
    <header class="editor-full-preview-head">
      <div><span class="eyebrow">PREVIEW</span><h2 id="fullPreviewTitle">전체 페이지 미리보기</h2><p>게시 전 수정 내용을 PC와 모바일 화면으로 확인합니다.</p></div>
      <div class="editor-full-preview-actions">
        <div class="preview-device-switch" aria-label="미리보기 화면 크기"><button type="button" data-full-device="desktop" class="active">PC</button><button type="button" data-full-device="mobile">모바일</button></div>
        <button class="btn btn-outline" type="button" data-close-full-preview>미리보기 닫기</button>
      </div>
    </header>
    <div class="editor-full-preview-scroll">
      <div class="editor-full-preview-document" id="fullPreviewDocument">
        <div class="preview-hero" id="fullPreviewHero"></div>
        <div id="fullPreviewFixed"></div>
        <div class="editor-preview-blocks" id="fullPreviewBlocks"></div>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/file-service-config.js?v=20260802-files"></script>
<script src="assets/file-service.js?v=20260802-files"></script>
<script src="assets/page-blocks.js?v=20260802-ui"></script>
<script src="assets/page-editor.js?v=20260802-files"></script>
</body>
</html>
